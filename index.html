<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WMS Mattress | Warehouse Management System</title>
<link rel="icon" href="assets/favicon.svg">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div id="toast"></div>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">W</div><div><b>WMS Mattress</b><small>Warehouse System</small></div></div>
    <nav id="nav">
      <button data-page="dashboard">⌂ <span>Dashboard</span></button>
      <div class="nav-title">MASTER DATA</div>
      <button data-page="materials">▦ <span>Bahan Baku</span></button>
      <button data-page="suppliers">♜ <span>Supplier</span></button>
      <button data-page="locations">⌗ <span>Lokasi Gudang</span></button>
      <button data-page="users">♙ <span>User</span></button>
      <div class="nav-title">TRANSAKSI</div>
      <button data-page="receiving">↓ <span>Barang Masuk</span></button>
      <button data-page="putaway">↳ <span>Putaway</span></button>
      <button data-page="issuing">↑ <span>Barang Keluar</span></button>
      <button data-page="movement">⇄ <span>Stock Movement</span></button>
      <div class="nav-title">INVENTORY</div>
      <button data-page="stock">▤ <span>Stok Gudang</span></button>
      <button data-page="opname">☑ <span>Stock Opname</span></button>
      <button data-page="adjustment">± <span>Stock Adjustment</span></button>
      <div class="nav-title">APPROVAL</div>
      <button data-page="approval">✓ <span>Approval Adjustment</span></button>
      <div class="nav-title">LAPORAN</div>
      <button data-page="reports">▥ <span>Laporan</span></button>
      <button data-page="audit">◷ <span>Audit Trail</span></button>
    </nav>
    <div class="sidebar-foot">WMS v1.0 • Mattress Manufacturing</div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button id="menuBtn" class="icon-btn">☰</button>
      <div><div id="pageTitle">Dashboard</div><small id="pageSub">Monitoring persediaan real-time</small></div>
      <div class="top-actions">
        <button class="notification" id="notifBtn">🔔 <span id="notifCount">0</span></button>
        <div class="user-chip"><div class="avatar">JP</div><div><b id="userName">Jaka Pertaka</b><small id="userRole">Warehouse Staff</small></div></div>
        <button class="ghost" id="logoutBtn">Logout</button>
      </div>
    </header>
    <section id="content" class="content"></section>
  </main>
</div>
<div id="modal" class="modal-backdrop hidden"><div class="modal"><div class="modal-head"><h3 id="modalTitle">Form</h3><button id="closeModal">×</button></div><div id="modalBody"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
